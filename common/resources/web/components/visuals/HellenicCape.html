<div class="module-main" v-if="config">
    <div class="description">
        Shows a cape on your player, and on your elytra too. Only you can see it, other players still see your normal cape. Click a cape to wear it.
    </div>

    <div class="module-sections">
        <div>
            <switch-checkbox v-model="config.enabled" @change="update()">Enabled</switch-checkbox>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px;">
            <button v-for="c in capes" :key="c.id" type="button" @click="wear(c.id)"
                    :style="{
                        display: 'flex', flexDirection: 'column', gap: '8px', padding: '12px', width: '134px',
                        cursor: 'pointer', textAlign: 'left', font: 'inherit', color: 'inherit',
                        borderRadius: '12px',
                        border: isWorn(c.id) ? '1px solid #d946ef' : '1px solid rgba(168, 85, 247, 0.28)',
                        background: isWorn(c.id) ? 'rgba(217, 70, 239, 0.14)' : 'rgba(16, 10, 29, 0.6)',
                        boxShadow: isWorn(c.id) ? '0 0 0 3px rgba(217, 70, 239, 0.18), 0 12px 32px rgba(217, 70, 239, 0.22)' : 'none'
                    }">
                <img :src="'/images/capes/' + c.id + '.png'" :alt="c.name" width="110" height="176"
                     style="display: block; border-radius: 6px;">
                <span style="font-weight: 700;">{{ c.name }}</span>
                <span :style="{ fontSize: '12px', color: isWorn(c.id) ? '#4ade80' : '#a99bc6' }">{{ isWorn(c.id) ? 'Equipped' : c.note }}</span>
            </button>
        </div>
    </div>
</div>
